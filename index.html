<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madrasatul Madinah | মাদরাসাতুল মাদিনাহ</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@600&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F0E8;--cd:#FFFDF9;--ink:#2A1A14;--mu:#7A6A60;--pr:#8E2F2F;--ac:#C9A15B;--ok:#2F7D4F;--bd:#B3372E;--ln:#E6DACB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#120D0C;--cd:#1D1514;--ink:#F0E6D8;--mu:#B3A394;--pr:#B34A42;--ln:#33261F;--ok:#5DBB86;--bd:#F08A7E}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#120D0C;--cd:#1D1514;--ink:#F0E6D8;--mu:#B3A394;--pr:#B34A42;--ln:#33261F;--ok:#5DBB86;--bd:#F08A7E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Hind Siliguri',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding-bottom:92px}
.hd{background:linear-gradient(#0A0605,#1B100D);border-bottom:2px solid var(--ac);padding:18px 16px 14px;display:flex;gap:14px;align-items:center}
.lg{width:70px;height:70px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--ac)}
.ar{font:700 31px/1.3 Amiri,serif;color:#EBDDC3}
.en{font:600 20px/1.2 'Cormorant Garamond',Georgia,serif;color:var(--ac);letter-spacing:.05em}
.bn{font-size:14px;color:#CDBFAE}
.seg{display:flex;gap:6px;margin:14px 16px 0}
.seg button{flex:1;padding:9px 4px;border:1px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.seg .on{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:700}
.sec{padding:14px 16px}
h3{margin:18px 0 8px;font-size:17px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 .c{margin:0}.st{color:var(--mu);font-size:14px}
.st b{display:block;font-size:27px;line-height:1.3;color:var(--ink)}
.mu{color:var(--mu)}.ok{color:var(--ok)}.bad{color:var(--bd)}
.b{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;background:var(--pr);color:#fff;cursor:pointer}
.b.g{background:transparent;border:1px solid var(--ln);color:var(--ink)}
.bs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tg{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--ln);white-space:nowrap}
input,textarea,select{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--ink);margin-bottom:10px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl button{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:18px 8px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.mk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mk input{padding:8px 4px;text-align:center;margin-bottom:6px;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{font-style:normal;text-align:center;padding:7px 0;border-radius:8px;font-size:13px;background:var(--ln)}
.cal .p{color:var(--ok);background:rgba(47,125,79,.15)}.cal .a{color:var(--bd);background:rgba(179,55,46,.18)}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:3px 4px calc(3px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;border-top:3px solid transparent;font:inherit;font-size:13.5px;color:var(--mu);padding:9px 1px;cursor:pointer}
nav .on{color:var(--ink);font-weight:700;border-top-color:var(--ac)}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:15px;white-space:nowrap}
</style></head><body>
<div id="app"></div><div id="t"></div>
<script>

tc:[{n:'মো. হাবিবুর রহমান',sal:6000,paid:false,on:true},{n:'আয়েশা খাতুন',sal:5500,paid:true,on:true}],
ft:[['মাসিক বেতন',800],['ভর্তি ফি',1000],['পরীক্ষা ফি',200]],fh:[],

hw:['আ-কার লেখা, পৃষ্ঠা ১২','১ থেকে ২০ পর্যন্ত গোনা'],info:{a:'ঢাকা, বাংলাদেশ',p:'০১৭০০-০০০০০০'},mk:{},cm:{}};
S.st.forEach(s=>{S.mk[s.id]=[70+s.id%5*5,75+s.id%4*5,65+s.id%6*5,85+s.id%3*4];S.cm[s.id]='নিয়মিত ও মনোযোগী।'});
const F=id=>S.st.find(s=>s.id==id),FEE=()=>S.ft[0][1],G=m=>m>=80?'A+':m>=70?'A':m>=60?'A-':m>=50?'B':m>0?'C':'-';
const C=h=>`<div class="c">${h}</div>`,RW=(a,b)=>`<div class="c r"><div>${a}</div>${b}</div>`,H=t=>`<h3>${t}</h3>`;

'ক্লাস':()=>S.cl.map(c=>RW(`<b>${c}</b>`,TG(bn(S.st.filter(s=>s.c==c).length)+' জন'))).join('')+I('nc','নতুন ক্লাসের নাম')+B('ক্লাস যোগ করুন',"add([v('nc')],()=>S.cl.push(v('nc')))"),

'বেতন':()=>S.tc.map((t,i)=>RW(SB(t.n,'৳'+bn(t.sal)),t.paid?TG('প্রদান','ok'):B('বেতন দিন',`TP(${i})`))).join(''),
'আয়-ব্যয়':()=>`<div class="g2"><div class="c st"><b>৳${bn(S.ac.filter(x=>x.k).reduce((s,x)=>s+x.a,0))}</b>মোট আয়</div><div class="c st"><b>৳${bn(S.ac.filter(x=>!x.k).reduce((s,x)=>s+x.a,0))}</b>মোট ব্যয়</div></div>`+H('লেনদেন')+S.ac.map(x=>RW(x.t,TG((x.k?'+':'−')+'৳'+bn(x.a),x.k?'ok':'bad'))).join('')+H('নতুন হিসাব')+I('at','বিবরণ')+I('aa','টাকা','number')+SEL('ak',['আয়','ব্যয়'])+B('যোগ করুন',"add([v('at'),v('aa')],()=>S.ac.unshift({t:v('at'),a:+v('aa'),k:$('#ak').value=='আয়'}))"),
'ফির ধরন':()=>S.ft.map(f=>RW(f[0],TG('৳'+bn(f[1])))).join('')+I('fn','ফির নাম')+I('fa','টাকা','number')+B('ফির ধরন যোগ করুন',"add([v('fn'),v('fa')],()=>S.ft.push([v('fn'),+v('fa')]))"),
'ফলাফল':()=>C(`অবস্থা: <b>${S.pub?'অভিভাবকদের জন্য প্রকাশিত':'গোপন আছে'}</b>`)+B(S.pub?'গোপন করুন':'ফলাফল প্রকাশ করুন','S.pub=!S.pub;R()')+H('গড় ফলাফল')+S.st.map(s=>{const m=S.mk[s.id],a=Math.round(m.reduce((x,y)=>x+y,0)/4);return RW(SB(s.n,'ক্লাস '+s.c),TG(bn(a)+' · '+G(a)))}).join(''),
'ক্যালেন্ডার':()=>EV()+I('ed','তারিখ (যেমন ২০ নভেম্বর)')+I('et','অনুষ্ঠান বা ছুটি')+B('যোগ করুন',"add([v('ed'),v('et')],()=>S.ev.push([v('ed'),v('et')]))"),

const V={admin:[
()=>`<div class="g2"><div class="c st"><b>${bn(S.st.length)}</b>ছাত্র-ছাত্রী</div><div class="c st"><b>${bn(S.st.filter(s=>s.here).length)}</b>আজ উপস্থিত</div><div class="c st"><b>৳${bn(S.st.filter(s=>!s.paid).length*FEE())}</b>বকেয়া</div><div class="c st"><b>৳${bn(bal())}</b>হাতে আছে</div></div>`+H('সর্বশেষ নোটিশ')+C(S.nt[0]||'কোনো নোটিশ নেই')+H('আসছে')+C(S.ev[0]?S.ev[0][0]+': '+S.ev[0][1]:'কিছু নেই'),

AS['ব্যাকআপ']=()=>C('নিয়মিত ব্যাকআপ নিন এবং ফাইলটি নিরাপদ জায়গায় রাখুন।')+H('ফাইল ডাউনলোড')+B('ছাত্র তালিকা (Excel/CSV)','dlCSV()')+B('ব্যাকআপ ফাইল (JSON)','dlJSON()',1)+H('সম্পূর্ণ ব্যাকআপ (JSON)')+`<textarea id="bj" rows="4" readonly>${escA2(JSON.stringify(Object.fromEntries(BKK.map(k=>[k,S[k]]))))}</textarea>`+B('কপি করুন',"navigator.clipboard.writeText($('#bj').value).then(()=>T('কপি হয়েছে'),()=>T('ঘরটি চেপে ধরে কপি করুন'))")+H('রিস্টোর')+`<textarea id="rs" rows="3" placeholder="ব্যাকআপ এখানে পেস্ট করুন"></textarea>`+B('রিস্টোর করুন','restoreAll()');
</script>
<script>
const CKEY='mmcontact';
const contactCfg=()=>{try{return JSON.parse(localStorage.getItem(CKEY)||'{}')}catch(e){return{}}};
const enDig=x=>String(x==null?'':x).replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
const waNum=x=>{const n=enDig(x).replace(/\D/g,'');return n.startsWith('0')?'880'+n.slice(1):n};
const telNum=x=>enDig(x).replace(/[^0-9+]/g,'');
const contactCard=()=>{
 const c=contactCfg();const it=[];
 if(c.phone){it.push(['কল করুন','tel:'+telNum(c.phone)]);it.push(['হোয়াটসঅ্যাপ','https://wa.me/'+waNum(c.phone)])}
 if(c.email)it.push(['ইমেইল','mailto:'+c.email]);
 if(c.fb)it.push(['ফেসবুক পেজ',c.fb]);
 if(!it.length)return '';
 return H('যোগাযোগ')+C(it.map(([t,h])=>`<a class="b" href="${escA(h)}" target="_blank" rel="noopener" style="display:inline-block;margin:4px 6px 4px 0;text-decoration:none">${t}</a>`).join(''));
};
window.saveContact=()=>{
 const fb=$('#cfb').value.trim();
 const o={phone:$('#cph').value.trim(),email:$('#cem').value.trim(),fb:fb.startsWith('https://')?fb:''};
 if(fb&&!o.fb){T('ফেসবুক লিংক https:// দিয়ে শুরু হতে হবে');return}
 try{localStorage.setItem(CKEY,JSON.stringify(o))}catch(e){}
 T('যোগাযোগের তথ্য সংরক্ষিত হয়েছে');R();
};
AS['যোগাযোগ']=()=>{
 const c=contactCfg();
 return C('এখানে যা লিখবেন, তা অভিভাবকের হোম পাতায় কল, হোয়াটসঅ্যাপ, ইমেইল ও ফেসবুক বাটন হিসেবে দেখাবে।')
 +`<input id="cph" placeholder="মাদরাসার ফোন নম্বর" value="${escA(c.phone||'')}">`
 +`<input id="cem" type="email" placeholder="ইমেইল" value="${escA(c.email||'')}">`
 +`<input id="cfb" placeholder="ফেসবুক পেজের লিংক (https://...)" value="${escA(c.fb||'')}">`
 +B('সংরক্ষণ','saveContact()');
};
const gHome=V.guardian[0];
V.guardian[0]=()=>gHome()+contactCard();
</script>
<script>
const stContactRows=list=>list.filter(s=>s.ph).map(s=>RW(`<b>${escA(s.n)}</b> <small class="mu">${escA(s.pn)}</small>`,`<a class="b" href="tel:${telNum(s.ph)}" style="text-decoration:none">কল</a> <a class="b g" href="https://wa.me/${waNum(s.ph)}" target="_blank" rel="noopener" style="text-decoration:none">হোয়াটসঅ্যাপ</a>`)).join('')||C('কোনো ফোন নম্বর নেই।');
const admStud=V.admin[1];
V.admin[1]=()=>admStud()+H('অভিভাবকের সাথে যোগাযোগ')+stContactRows(S.st);
const tchHome=V.teacher[0];
V.teacher[0]=()=>tchHome()+H('আমার ক্লাসের অভিভাবক')+stContactRows(S.st.filter(s=>s.c==S.tcl));
</script>
